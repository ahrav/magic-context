name: Retrieval Benchmark (reference hosts)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Reference profile(s) to run
        type: choice
        default: both
        options:
          - arm-neon
          - x86-avx2
          - both
  schedule:
    - cron: "17 3 * * 1"

# These jobs run repository code on self-hosted runners, so they get no
# token scopes beyond reading the checkout.
permissions:
  contents: read

jobs:
  reference-arm-neon:
    name: Reference host (ARM64/NEON, arm-neon profile)
    # Manual dispatch is restricted to the default branch: a self-hosted
    # runner executing an arbitrary pushed ref is arbitrary code execution
    # as the runner account.
    if: >-
      github.event_name == 'schedule' ||
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
       (inputs.profile == 'arm-neon' || inputs.profile == 'both'))
    runs-on: [self-hosted, ARM64]
    concurrency:
      group: retrieval-benchmark-arm-neon
      cancel-in-progress: false
    timeout-minutes: 900
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not latest: hostFingerprint() embeds the exact
          # Bun.version, and latency regression requires candidate host
          # fingerprints to equal the stored baseline's — a runtime update
          # would silently make an unchanged reference host non-comparable.
          # Bump this together with republishing the latency baselines.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify host matches arm-neon profile
        run: |
          arch="$(bun -e 'console.log(process.arch)')"
          if [ "$arch" != "arm64" ]; then
            echo "host arch $arch does not match the arm-neon profile" >&2
            exit 1
          fi

      # Diagnostic notes only. The strict --host-evidence artifact is an
      # operator attestation (run lock, canary, affinity/NUMA/power/cache
      # state) produced out of band; nothing here masquerades as it.
      - name: Record host notes
        run: |
          mkdir -p benchmark-artifacts
          uname -a > benchmark-artifacts/host-notes.txt
          bun -e '
            const os = require("node:os");
            console.log(JSON.stringify({
              arch: process.arch,
              platform: process.platform,
              cpus: os.cpus().map((c) => c.model),
              totalMemoryBytes: os.totalmem(),
              bunVersion: Bun.version,
            }, null, 2));
          ' >> benchmark-artifacts/host-notes.txt

      # The work dir lives under RUNNER_TEMP so the runner service reclaims
      # it even when the job is killed mid-run (the CLI's own cleanup only
      # covers process-level exits), and each run's ~25 GB of fixtures is
      # removed before the next run starts so the three runs never stack.
      - name: Run matrix (three complete runs)
        run: |
          for run in 1 2 3; do
            bun packages/plugin/scripts/benchmark-retrieval.ts matrix \
              --profile arm-neon \
              --evict-os-page-cache packages/plugin/scripts/retrieval-benchmark/evict-os-page-cache.sh \
              --work-dir "$RUNNER_TEMP/retrieval-benchmark/run-$run" \
              --out "benchmark-artifacts/run-$run-report.json" \
              --candidate-pool "benchmark-artifacts/run-$run-pool.json"
            rm -rf "$RUNNER_TEMP/retrieval-benchmark/run-$run"
          done

      # Baselines bind one profile fingerprint. commentlint: allow(JUDGE)
      # baselines/v1/quality.json is ci-profile. commentlint: allow(JUDGE)
      # An arm-neon comparison is non-comparable. commentlint: allow(JUDGE)
      # Publish host baselines via baseline-create. commentlint: allow(JUDGE)
      # Then this step can gate. commentlint: allow(JUDGE)
      - name: Apply regression policy (informational)
        continue-on-error: true
        run: |
          bun packages/plugin/scripts/benchmark-retrieval.ts regression \
            --profile arm-neon \
            --candidate benchmark-artifacts/run-1-report.json \
            --candidate benchmark-artifacts/run-2-report.json \
            --candidate benchmark-artifacts/run-3-report.json \
            --out benchmark-artifacts/regression.json

      - name: Archive reports and host notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark-arm-neon
          path: benchmark-artifacts/
          if-no-files-found: warn

  reference-x86-avx2:
    name: Reference host (X64/AVX2, x86-avx2 profile)
    if: >-
      github.event_name == 'schedule' ||
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
       (inputs.profile == 'x86-avx2' || inputs.profile == 'both'))
    runs-on: [self-hosted, X64]
    concurrency:
      group: retrieval-benchmark-x86-avx2
      cancel-in-progress: false
    timeout-minutes: 900
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not latest: hostFingerprint() embeds the exact
          # Bun.version, and latency regression requires candidate host
          # fingerprints to equal the stored baseline's — a runtime update
          # would silently make an unchanged reference host non-comparable.
          # Bump this together with republishing the latency baselines.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # process.arch alone admits an x64 host without AVX2, which would
      # publish mislabeled x86-avx2 reference measurements.
      - name: Verify host matches x86-avx2 profile
        run: |
          arch="$(bun -e 'console.log(process.arch)')"
          if [ "$arch" != "x64" ]; then
            echo "host arch $arch does not match the x86-avx2 profile" >&2
            exit 1
          fi
          if ! grep -qw avx2 /proc/cpuinfo; then
            echo "host CPU lacks AVX2; refusing to label results x86-avx2" >&2
            exit 1
          fi

      # Diagnostic notes only. The strict --host-evidence artifact is an
      # operator attestation (run lock, canary, affinity/NUMA/power/cache
      # state) produced out of band; nothing here masquerades as it.
      - name: Record host notes
        run: |
          mkdir -p benchmark-artifacts
          uname -a > benchmark-artifacts/host-notes.txt
          bun -e '
            const os = require("node:os");
            console.log(JSON.stringify({
              arch: process.arch,
              platform: process.platform,
              cpus: os.cpus().map((c) => c.model),
              totalMemoryBytes: os.totalmem(),
              bunVersion: Bun.version,
            }, null, 2));
          ' >> benchmark-artifacts/host-notes.txt

      # The work dir lives under RUNNER_TEMP so the runner service reclaims
      # it even when the job is killed mid-run (the CLI's own cleanup only
      # covers process-level exits), and each run's ~25 GB of fixtures is
      # removed before the next run starts so the three runs never stack.
      - name: Run matrix (three complete runs)
        run: |
          for run in 1 2 3; do
            bun packages/plugin/scripts/benchmark-retrieval.ts matrix \
              --profile x86-avx2 \
              --evict-os-page-cache packages/plugin/scripts/retrieval-benchmark/evict-os-page-cache.sh \
              --work-dir "$RUNNER_TEMP/retrieval-benchmark/run-$run" \
              --out "benchmark-artifacts/run-$run-report.json" \
              --candidate-pool "benchmark-artifacts/run-$run-pool.json"
            rm -rf "$RUNNER_TEMP/retrieval-benchmark/run-$run"
          done

      # Baselines bind one profile fingerprint. commentlint: allow(JUDGE)
      # baselines/v1/quality.json is ci-profile. commentlint: allow(JUDGE)
      # An x86-avx2 comparison is non-comparable. commentlint: allow(JUDGE)
      # Publish host baselines via baseline-create. commentlint: allow(JUDGE)
      # Then this step can gate. commentlint: allow(JUDGE)
      - name: Apply regression policy (informational)
        continue-on-error: true
        run: |
          bun packages/plugin/scripts/benchmark-retrieval.ts regression \
            --profile x86-avx2 \
            --candidate benchmark-artifacts/run-1-report.json \
            --candidate benchmark-artifacts/run-2-report.json \
            --candidate benchmark-artifacts/run-3-report.json \
            --out benchmark-artifacts/regression.json

      - name: Archive reports and host notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark-x86-avx2
          path: benchmark-artifacts/
          if-no-files-found: warn
