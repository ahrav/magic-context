#
#
name: historian-eval

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Corpus to run (dev split, or a frozen release once one exists)
        type: choice
        options:
          - dev
        default: dev
      metamorphic_scenario:
        description: Scenario for the bounded live metamorphic pair
        type: string
        default: hse-webhook-docs-injection
      metamorphic_transform:
        description: Transform for the bounded live metamorphic pair
        type: choice
        options:
          - reorder-independent-turns
          - paraphrase-irrelevant
          - move-accepted-decision
          - duplicate-rejected-proposal
          - rename-unrelated-symbols
        default: paraphrase-irrelevant
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read

# Workflow-level, NOT per-job, and the placement is load-bearing. Both live lanes
# previously declared this same group per-job: within one run that made one lane
# run while the other sat PENDING, and GitHub keeps only one running plus one
# pending member per concurrency group — a newly queued member evicts the
# existing pending one even under `cancel-in-progress: false`. Any schedule tick
# or operator dispatch overlapping a run in flight (the live step alone is
# bounded at 300 minutes) therefore cancelled the queued lane, and the run
# published one report instead of two with nothing marking the loss. Grouping the
# RUN makes the unit of exclusion the whole run, so a run already in flight is
# never partially discarded; the lanes serialize inside the run through `needs`.
concurrency:
  group: historian-eval-live
  cancel-in-progress: false

jobs:
  live-lane:
    # The condition restricts manual dispatch to the default branch because a pushed branch can modify scripts before the Anthropic key is exposed.
    # A pushed branch could modify the runner or package lifecycle script and exfiltrate the Anthropic key.
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are limited to 360 minutes.
    # `--deadline-minutes` reserves time before the live-step timeout for report completion.
    # The job timeout must leave time for setup and archival after the live step.
    # Otherwise GitHub cancels the job before the archive step can upload the report.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinning Bun prevents identical system tuples from representing different harness and bundle bytes.
          # new-Bun breakage.
          bun-version: "1.4.0"

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Record the resolved opencode version
        run: opencode --version

      - name: Build the plugin the harness loads
        run: bun run --cwd packages/plugin build

      - name: Resolve the corpus selection
        env:
          # Template interpolation would let a crafted dispatch value become shell source.
          CORPUS_INPUT: ${{ inputs.scenarios }}
        # Schedule runs default to dev when inputs.scenarios is absent.
        # Only literal case-arm values reach `GITHUB_ENV`.
        run: |
          case "${CORPUS_INPUT:-dev}" in
            dev) SELECT_FLAG=--scenarios; SELECT_PATH=packages/e2e-tests/historian-eval/dev ;;
            *) echo "unknown corpus: $CORPUS_INPUT" >&2; exit 1 ;;
          esac
          echo "SELECT_FLAG=$SELECT_FLAG" >> "$GITHUB_ENV"
          echo "SELECT_PATH=$SELECT_PATH" >> "$GITHUB_ENV"

      # The workflow runs lint and mutations before live API calls to avoid spending tokens on rejected corpora.
      # The gate step does not receive ANTHROPIC_API_KEY.
      - name: Gate the corpus (freeze lint + mutation battery)
        run: |
          bun packages/e2e-tests/scripts/run-historian-eval.ts --lint "$SELECT_FLAG" "$SELECT_PATH"
          bun packages/e2e-tests/scripts/run-historian-eval.ts --mutations "$SELECT_FLAG" "$SELECT_PATH"

      - name: Run the live lane
        # The 290-minute script deadline leaves 10 minutes before the 300-minute step timeout; the 360-minute job timeout leaves 60 minutes outside the live step for setup and archival.
        # The job timeout includes setup before the live step; the step timeout does not.
        timeout-minutes: 300
        env:
          NODE_ENV: ""
          ANTHROPIC_API_KEY: ${{ secrets.HISTORIAN_EVAL_ANTHROPIC_API_KEY }}
          HISTORIAN_EVAL_MODEL: anthropic/claude-sonnet-4-5
          HISTORIAN_EVAL_PROBE_MODEL: anthropic/claude-haiku-4-5
        run: |
          bun packages/e2e-tests/scripts/run-historian-eval.ts --live "$SELECT_FLAG" "$SELECT_PATH" \
            --deadline-minutes 290 \
            --report packages/e2e-tests/artifacts/historian-eval-report.json

      - name: Archive the lane report and run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historian-eval-report
          path: packages/e2e-tests/artifacts/
          if-no-files-found: warn

  live-metamorphic:
    # Sequential after `live-lane`, not parallel with it: both lanes spend the
    # same Anthropic key on the same model, and the runner treats a rate-limited
    # slow response as `run-never-fired` — an invalidated experiment rather than a
    # retry. `!cancelled()` rather than a bare `needs` or `always()`: a red
    # `live-lane` must not skip this independent lane (the short-circuit ci.yml
    # documents at length), but an operator cancelling the run must not leave this
    # lane starting up to spend tokens anyway.
    needs: live-lane
    if: >-
      ${{ !cancelled() &&
      (github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Resolve the corpus selection
        env:
          CORPUS_INPUT: ${{ inputs.scenarios }}
        run: |
          case "${CORPUS_INPUT:-dev}" in
            dev) SELECT_PATH=packages/e2e-tests/historian-eval/dev ;;
            *) echo "unknown corpus: $CORPUS_INPUT" >&2; exit 1 ;;
          esac
          echo "SELECT_PATH=$SELECT_PATH" >> "$GITHUB_ENV"

      - name: Gate the base corpus without credentials
        run: |
          bun packages/e2e-tests/scripts/run-historian-eval.ts --lint --scenarios "$SELECT_PATH"
          bun packages/e2e-tests/scripts/run-historian-eval.ts --mutations --scenarios "$SELECT_PATH"

      - name: Run the live metamorphic pair
        # Same nesting as the historian lane above:
        #   script --deadline-minutes 290  <  this step 300  <  job 360
        # Two properties make 290 sufficient rather than merely smaller than 300.
        # The script anchors its deadline at process START, so its own preamble
        # (corpus load, selection, `opencode --version`, commit resolution) is
        # inside the 290 rather than pushing it past the step bound. And it
        # RESERVES one role's full wall clock before admitting a role, where a
        # role's cost is every prompt it sends — transcript, per-run triggers and
        # probes, each bounded only by the harness prompt timeout — plus the run
        # completion and quiescence waits. A bare `now >= deadline` check would
        # admit a role at minute 289 that legitimately needs two hours, and this
        # step's timeout would then kill the process before it wrote the final
        # report, losing the artifact the deadline exists to protect.
        timeout-minutes: 300
        env:
          NODE_ENV: ""
          ANTHROPIC_API_KEY: ${{ secrets.HISTORIAN_EVAL_ANTHROPIC_API_KEY }}
          HISTORIAN_EVAL_MODEL: anthropic/claude-sonnet-4-5
          HISTORIAN_EVAL_PROBE_MODEL: anthropic/claude-haiku-4-5
          METAMORPHIC_SCENARIO: ${{ inputs.metamorphic_scenario }}
          METAMORPHIC_TRANSFORM: ${{ inputs.metamorphic_transform }}
        run: |
          bun packages/e2e-tests/scripts/run-metamorphic-eval.ts --live \
            --scenarios "$SELECT_PATH" \
            --scenario "${METAMORPHIC_SCENARIO:-hse-webhook-docs-injection}" \
            --transform "${METAMORPHIC_TRANSFORM:-paraphrase-irrelevant}" \
            --deadline-minutes 290 \
            --report packages/e2e-tests/artifacts/metamorphic-eval-live-report.json

      - name: Archive the metamorphic report and run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historian-eval-metamorphic-report
          path: packages/e2e-tests/artifacts/
          if-no-files-found: warn
