#
#
name: historian-eval

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Corpus to run (dev split, or a frozen release once one exists)
        type: choice
        options:
          - dev
        default: dev
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  live-lane:
    # The condition restricts manual dispatch to the default branch because a pushed branch can modify scripts before the Anthropic key is exposed.
    # A pushed branch could modify the runner or package lifecycle script and exfiltrate the Anthropic key.
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are limited to 360 minutes.
    # `--deadline-minutes` reserves time before the live-step timeout for report completion.
    # The job timeout must leave time for setup and archival after the live step.
    # Otherwise GitHub cancels the job before the archive step can upload the report.
    timeout-minutes: 360
    concurrency:
      group: historian-eval-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinning Bun prevents identical system tuples from representing different harness and bundle bytes.
          # new-Bun breakage.
          bun-version: "1.4.0"

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Record the resolved opencode version
        run: opencode --version

      - name: Build the plugin the harness loads
        run: bun run --cwd packages/plugin build

      - name: Resolve the corpus selection
        env:
          # Template interpolation would let a crafted dispatch value become shell source.
          CORPUS_INPUT: ${{ inputs.scenarios }}
        # Schedule runs default to dev when inputs.scenarios is absent.
        # Only literal case-arm values reach `GITHUB_ENV`.
        run: |
          case "${CORPUS_INPUT:-dev}" in
            dev) SELECT_FLAG=--scenarios; SELECT_PATH=packages/e2e-tests/historian-eval/dev ;;
            *) echo "unknown corpus: $CORPUS_INPUT" >&2; exit 1 ;;
          esac
          echo "SELECT_FLAG=$SELECT_FLAG" >> "$GITHUB_ENV"
          echo "SELECT_PATH=$SELECT_PATH" >> "$GITHUB_ENV"

      # The workflow runs lint and mutations before live API calls to avoid spending tokens on rejected corpora.
      # The gate step does not receive ANTHROPIC_API_KEY.
      - name: Gate the corpus (freeze lint + mutation battery)
        run: |
          bun packages/e2e-tests/scripts/run-historian-eval.ts --lint "$SELECT_FLAG" "$SELECT_PATH"
          bun packages/e2e-tests/scripts/run-historian-eval.ts --mutations "$SELECT_FLAG" "$SELECT_PATH"

      - name: Run the live lane
        # The 290-minute script deadline leaves 10 minutes before the 300-minute step timeout; the 360-minute job timeout leaves 60 minutes outside the live step for setup and archival.
        # The job timeout includes setup before the live step; the step timeout does not.
        timeout-minutes: 300
        env:
          NODE_ENV: ""
          ANTHROPIC_API_KEY: ${{ secrets.HISTORIAN_EVAL_ANTHROPIC_API_KEY }}
          HISTORIAN_EVAL_MODEL: anthropic/claude-sonnet-4-5
          HISTORIAN_EVAL_PROBE_MODEL: anthropic/claude-haiku-4-5
        run: |
          bun packages/e2e-tests/scripts/run-historian-eval.ts --live "$SELECT_FLAG" "$SELECT_PATH" \
            --deadline-minutes 290 \
            --report packages/e2e-tests/artifacts/historian-eval-report.json

      - name: Archive the lane report and run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historian-eval-report
          path: packages/e2e-tests/artifacts/
          if-no-files-found: warn
