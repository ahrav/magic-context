# Historian structural eval lane: live scenario runs (task magic-context-x4l.11).
#
# Scheduled or operator-dispatched ONLY (R14): each scenario costs up to four
# live historian invocations plus one cheap probe-answer call per probe. The
# deterministic parts (contract lint, scorer tests, mutation battery) run
# per-PR inside ci.yml with no credentials.
#
# Flake triage on a red scheduled run = re-dispatch; each run is an
# independent report (no repeat-count machinery).
name: historian-eval

on:
  workflow_dispatch:
    inputs:
      scenarios:
        # Only committed corpora are offered. A frozen release adds its own
        # choice here and a matching case arm below; advertising a release
        # directory that does not exist yet just fails the corpus gate.
        description: Corpus to run (dev split, or a frozen release once one exists)
        type: choice
        options:
          - dev
        default: dev
  schedule:
    # Weekly, offset from the retrieval-benchmark schedule.
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  live-lane:
    # Manual dispatch is restricted to the default branch: `actions/checkout`
    # takes the selected ref, and a later step puts the Anthropic key in the
    # environment. Any pushed branch could otherwise rewrite the runner script
    # or a package lifecycle script and exfiltrate the secret without review.
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Worst case: ~30 scenarios x (two historian runs + repair + probes) on a
    # live model.
    timeout-minutes: 240
    concurrency:
      group: historian-eval-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # The installer serves the current release, so the resolved version is
      # part of this run's system identity. The lane records it in the report's
      # system tuple; this step surfaces it in the log too.
      - name: Record the resolved opencode version
        run: opencode --version

      - name: Build the plugin the harness loads
        run: bun run --cwd packages/plugin build

      - name: Resolve the corpus selection
        env:
          # Input flows through env, never template interpolation, and is
          # validated against the closed corpus set below: interpolating
          # `inputs.*` into shell source would let a crafted dispatch value
          # execute with the API key in scope.
          CORPUS_INPUT: ${{ inputs.scenarios }}
        # Schedule runs carry no inputs and take the dev split. Freezing a
        # release adds its `--release` arm here, its choice in the dispatch
        # input above, and flips this default — the arms and the offered
        # choices stay one-to-one, which is what makes validating against the
        # closed set meaningful. The resolved values are literals from those
        # arms, so exporting them through GITHUB_ENV is safe.
        run: |
          case "${CORPUS_INPUT:-dev}" in
            dev) SELECT_FLAG=--scenarios; SELECT_PATH=packages/e2e-tests/historian-eval/dev ;;
            *) echo "unknown corpus: $CORPUS_INPUT" >&2; exit 1 ;;
          esac
          echo "SELECT_FLAG=$SELECT_FLAG" >> "$GITHUB_ENV"
          echo "SELECT_PATH=$SELECT_PATH" >> "$GITHUB_ENV"

      # Free deterministic gates first: a corpus regression that `--lint` or
      # the mutation battery would catch must fail the run before any live
      # API spend, and before a report is published over a corpus the lane
      # itself would reject. No credentials in scope.
      - name: Gate the corpus (freeze lint + mutation battery)
        run: |
          bun packages/e2e-tests/scripts/run-historian-eval.ts --lint "$SELECT_FLAG" "$SELECT_PATH"
          bun packages/e2e-tests/scripts/run-historian-eval.ts --mutations "$SELECT_FLAG" "$SELECT_PATH"

      - name: Run the live lane
        env:
          NODE_ENV: ""
          ANTHROPIC_API_KEY: ${{ secrets.HISTORIAN_EVAL_ANTHROPIC_API_KEY }}
          HISTORIAN_EVAL_MODEL: anthropic/claude-sonnet-4-5
          HISTORIAN_EVAL_PROBE_MODEL: anthropic/claude-haiku-4-5
        run: |
          bun packages/e2e-tests/scripts/run-historian-eval.ts --live "$SELECT_FLAG" "$SELECT_PATH" \
            --report packages/e2e-tests/artifacts/historian-eval-report.json

      - name: Archive the lane report and run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historian-eval-report
          path: packages/e2e-tests/artifacts/
          if-no-files-found: warn
