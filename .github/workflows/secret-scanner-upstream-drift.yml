name: Secret scanner upstream drift

# Daily run notices drift; narrow event triggers keep a fetch-unavailable exit off unrelated pull requests. commentlint: allow(JUDGE)
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/mc-secret-scanner/**'
      - 'scripts/check-secret-scanner-upstream-drift.sh'
      - '.github/workflows/secret-scanner-upstream-drift.yml'
  pull_request:
    paths:
      - 'crates/mc-secret-scanner/**'
      - 'scripts/check-secret-scanner-upstream-drift.sh'
      - '.github/workflows/secret-scanner-upstream-drift.yml'

permissions:
  contents: read

jobs:
  upstream-drift-gate:
    name: Secret scanner corpus pin and upstream drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # A drift the ledger already records exits zero, so review unblocks this gate. commentlint: allow(JUDGE)
      - name: Compare pinned sources against upstream
        run: sh scripts/check-secret-scanner-upstream-drift.sh
