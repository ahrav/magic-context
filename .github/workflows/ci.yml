name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

#
#   check-plugin, check-pi-plugin
#                  ↓
#   e2e-opencode, e2e-pi
#                  ↓
#   e2e-host-opencode, e2e-host-pi
#
# Docker e2e verifies a fresh install, clean doctor output, and one mock turn that writes database rows under the cortexkit path.
# Docker e2e catches packaging and install-flow regressions.
# Host e2e asserts byte-level wire behavior and multi-turn cache stability.
# Host e2e verifies historian publishing and tag-owner collision behavior.
# Host e2e covers synthetic `todowrite` and cross-harness memory behavior.
# Host e2e spawns real `opencode serve` and Pi subprocesses against an embedded mock provider.
# Host e2e catches cache-stability regressions that Docker smoke tests cannot detect.
#     cannot see.
#
# gauntlet.

jobs:
  shm-hardening-gate:
    name: SHM failure-hardening matrix gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Matrix validator unit tests
        working-directory: packages/e2e-tests
        run: bun test scripts/validate-shm-hardening-matrix.test.ts

      # `--allow-unresolved` leaves unresolved manifests nonfatal; FROZEN manifests remain strictly validated.
      # workflow edit.
      - name: Validate hardening matrix (strict when frozen)
        working-directory: packages/e2e-tests
        run: bun scripts/validate-shm-hardening-matrix.ts --allow-unresolved

  release-contract-gate:
    name: mc-host release contract drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The release contract has four byte-coupled representations: canonical JSON, Rust epoch constants, and two TypeScript embeddings.
      # The Rust constants supply production epoch values.
      # The release-contract check verifies that all four representations were regenerated together.
      - name: Check generated release contract for drift
        run: bun run release:contract:check

  shm-crash-recovery:
    name: SHM crash isolation + recovery (Linux, provisional ring tuple)
    runs-on: ubuntu-latest
    needs: [shm-hardening-gate]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      # The full soak is opt-in through `shm-hardening-optin.yml`, and this job uploads no artifacts.
      # The `--lib` pass runs `provider_recovery` controller unit tests that no integration binary exercises.
      # The `provider_recovery` controller tests cover stale retries, deadline isolation, and wedged cleanup.
      # The `provider_recovery` controller tests cover late-result fencing, inbox bounds, and custody accounting.
      - name: Crash, recovery, and soak-smoke suites
        run: |
          cargo nextest run -p mc-host --lib \
            --test shm_failure_modes --test shm_soak

  shm-source-build:
    name: Shared memory source build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      # The metadata-only stubs cannot support `mc-module`, because its dependencies import real types from the `../commons` cortexkit crates.
      # `mc-module` depends on `mc-core` and `mc-store`, which import real types from the `../commons` cortexkit crates.
      # `mc-host-lifecycle` checks out sibling sources because `mc-module` requires real `../commons` types.
      - name: Source-build transport, host, addon, and iceoryx
        run: |
          cargo build -p mc-shm-transport -p mc-host -p mc-shm-native
          cargo check -p mc-shm-transport --features iceoryx

      - name: Rust contracts and lifecycle (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo nextest run -p mc-shm-native -p mc-shm-transport
          cargo nextest run -p mc-host \
            --test shm_transport --test transport_negotiation

      # macOS retains no provider because cfg omits the Linux-only crash and soak harnesses.
      - name: Contracts, observer self-tests, and omission proof (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo nextest run -p mc-shm-transport \
            --test contract --test fuzz_corpus
          cargo nextest run -p mc-host --test shm_soak
          cargo test -p mc-host --lib \
            shm_provider::tests::platform_preflight_is_side_effect_free

      - name: Rust lease non-escape
        run: cargo test -p mc-host --doc

      - name: Build package-relative addon from source
        run: bun run --cwd packages/mc-shm-native build:source

      - name: Native behavior (Bun)
        run: bun run --cwd packages/mc-shm-native test:bun

      - name: Native behavior (Node 24)
        run: bun run --cwd packages/mc-shm-native test:node

      - name: Capability activation or clean omission (Bun and Node 24)
        run: |
          bun run --cwd packages/mc-shm-native test:capability:bun
          bun run --cwd packages/mc-shm-native test:capability:node

      - name: Plugin shared-memory contracts (Bun)
        run: bun test packages/plugin/src/shared/mc-host-client

      - name: Plugin shared-memory lifetime (Node 24)
        run: bun run --cwd packages/plugin test:mc-shm:node

      - name: Plugin typecheck
        run: bun run --cwd packages/plugin typecheck

      - name: Reject prebuilt native modules
        run: |
          test -z "$(git ls-files '*.node')"
          rm -f packages/mc-shm-native/mc_shm_native.node
          test ! -e packages/mc-shm-native/mc_shm_native.node

  mc-host-lifecycle:
    name: mc-host lifecycle integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: magic-context
    steps:
      - uses: actions/checkout@v5
        with:
          path: magic-context
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: ahrav/commons
          ref: d2208eda95d845193d84199dbfd0781a1f479291
          path: commons
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Host lifecycle and closure proofs (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test -p mc-host \
            --test broca_protocol \
            --test broca_subprocess \
            --test harness_closure \
            --test protocol_vectors

      - name: Native module adapter and CLI lifecycle (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test -p mc-module --bin ck-mc-host
          cargo test -p mc-module \
            --test host_adapter \
            --test lifecycle_cli

      # The Darwin leg verifies that the native lifecycle binary compiles and links for Darwin.
      # The Darwin leg verifies the lifecycle binary's argument-parsing and version/release-metadata contract.
      # The Darwin leg asserts nothing about lifecycle state.
      # Lifecycle-state proofs require a published daemon, which requires Broca's `/proc` process identity.
      # The daemon also requires a data root that the `O_NOFOLLOW` lifecycle path walk accepts.
      # The Darwin temporary directory's `/var` symlink fails the `O_NOFOLLOW` path walk.
      # The lifecycle-state proofs compile out of the Darwin leg.
      - name: Native lifecycle binary and CLI contract (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build -p mc-module --bin ck-mc-host
          cargo test -p mc-module --test lifecycle_cli

  check-plugin:
    name: Check (plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `node:sqlite` is reachable only under Node.
      # Node 24 also strips the smoke script's inline TypeScript.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Check compiled TUI freshness
        run: bun run --cwd packages/plugin check:tui-compiled

      # `test:release` runs `cargo tree -p mc-host`, which requires every path-dependency manifest.
      # `cargo tree` refuses to load the workspace unless every path-dependency manifest exists.
      # Every path dependency, including the `../commons` cortexkit crates, requires a manifest.
      # Metadata-only stubs satisfy Cargo's manifest graph without compiling the crates.
      # Nothing in this job compiles the stubs.
      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      # The toolchain action pins Cargo for the warm-up and for `test:release`'s `cargo tree`.
      # Without the toolchain action, the warm-up and `test:release` resolve to the runner image's Cargo.
      - uses: dtolnay/rust-toolchain@stable

      - name: Warm mc-host dependency graph
        run: cargo tree -p mc-host -e normal >/dev/null

      - name: Test
        run: bun run test

      # Node tests exercise the `node:sqlite` branch of `shared/sqlite.ts`.
      # Bun tests do not exercise Node-specific SQLite compatibility behavior.
      # bun test only covers the bun:sqlite branch, so the `transaction()` shim, `readonly`→`readOnly` mapping, and array-bind normalization would otherwise ship unverified on Pi/Desktop.
      - name: Smoke (node:sqlite backend)
        run: node packages/plugin/scripts/smoke-node-sqlite.ts

      # `bun test` resolves the smart-note WASM from `node_modules` when running source, so it cannot detect a missing bundled WASM in `dist`.
      # The test bundles `sandbox-runner` as the package build does and validates the bundle.
      - name: Smoke (smart-note wasm bundle)
        run: bun packages/plugin/scripts/smoke-smartnote-wasm.ts

      # `./tui` requires `@opentui/solid`'s JSX runtime at import time.
      # `bun test` never imports `@opentui/solid`'s JSX runtime, so dependency mismatches can make `./tui` fail to load.
      # The smoke test imports the entry as OpenCode loads the `./tui` export to catch missing or mismatched OpenTUI and Solid dependencies.
      - name: Smoke (TUI entry import)
        run: bun packages/plugin/scripts/smoke-tui-import.ts

      # The dev-path import cannot catch packaging breaks because OpenTUI's Solid transform skips `node_modules`.
      # Only a packed production install exercises the resolution path OpenCode's plugin cache uses.
      - name: Smoke (TUI packaged install import)
        run: bun packages/plugin/scripts/smoke-tui-pack-install.ts

      # Tokenizer loading is lazy, so import-only smoke tests do not resolve it.
      # The smoke test packs and npm-installs production dependencies before estimating tokens.
      # The smoke test runs the estimate from a compiled Bun host to match OpenCode's `/$bunfs/root` runtime.
      - name: Smoke (tokenizer packaged install estimate)
        run: bun packages/plugin/scripts/smoke-tokenizer-pack-install.ts

  check-pi-plugin:
    name: Check (pi-plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run --cwd packages/pi-plugin typecheck

      - name: Lint
        run: bun run --cwd packages/pi-plugin lint

      - name: Build
        run: bun run --cwd packages/pi-plugin build

      - name: Test
        run: bun run --cwd packages/pi-plugin test

  prospective-release-holdout:
    name: Prospective release holdout contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prospective holdout unit contracts
        run: bun run test:prospective-unit

      - name: Authenticate lifecycle-appropriate epoch artifacts
        run: bun run validate:prospective-holdout

      - name: E2E harness typecheck
        run: bun run --cwd packages/e2e-tests typecheck

  release-qualification-gate:
    name: Release contract + production-input qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The release-script suite needs a resolvable workspace because it checks the `mc-host` -> `mc-module` boundary with `cargo tree`.
      - uses: dtolnay/rust-toolchain@stable

      # Node 24 supplies npm 11.x, which production payload packing requires.
      # The runner image's npm version is not controlled by this job.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      - name: Release script unit tests
        run: bun run test:release

      - name: U8 release contract drift
        run: bun run release:contract:check

      # Byte verification needs production artifacts from the qualifying host.
      # Byte verification requires artifacts from the qualifying host, so `--check` remains portable.
      - name: U9 production-input qualification drift
        run: bun run release:qualify:check

      # Payload packages declare the `optionalDependencies` that resolve native bytes.
      # Bootstrap selects payloads without consulting the trust index.
      # Payload metadata and trust-index validation prevent edited payload metadata, parent optionalDependencies pin drift, and hand-edited trust artifacts from merging.
      # unchecked.
      - name: U6 payload package + trust index drift
        run: bun run release:payload:check

  # The `historian-eval-contracts` job runs independently so `prospective-release-holdout` failures cannot skip its gate.
  # A failure in an earlier `prospective-release-holdout` step would skip a later historian-eval step.
  # Neither `test:e2e` nor `test:opencode-e2e` invokes `historianEvalUnitFiles()`.
  # The `historian-eval-contracts` job runs the historian contract and freeze lint independently so other jobs cannot mask their regressions.
  #
  # The `historian-eval-contracts` job has no `needs` so its gates still run when `check-plugin` fails.
  # A job downstream of `check-plugin` is skipped when `check-plugin` fails.
  # Contract lint, scorer tests, freeze lint, and mutations run on every PR without credentials or live model calls.
  # Live scenario runs run only through scheduled or manually dispatched `historian-eval.yml` workflows.
  # historian-eval.yml only.
  historian-eval-contracts:
    name: Historian eval lane contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Historian eval unit contracts
        run: bun run test:historian-eval-unit

      - name: Freeze lint over the dev corpus
        run: bun packages/e2e-tests/scripts/run-historian-eval.ts --lint

      - name: Run the invalid-state mutation battery
        run: bun packages/e2e-tests/scripts/run-historian-eval.ts --mutations

  # The `dreamer-eval-contracts` job has no `needs` so an earlier job failure cannot skip it.
  # A gate in the same job as an earlier failing step is skipped.
  #
  # Neither `test:e2e` nor `test:opencode-e2e` invokes `test:dreamer-eval-unit`.
  # Neither `test:e2e` nor `test:opencode-e2e` reaches `dreamerEvalUnitFiles()`.
  # Without this job, the scenario contract, seeder, scorer, and mutation battery can regress while other lanes pass.
  # These suites require no credentials or live model calls; live scenarios do not run in PR CI.
  # per-PR CI.
  dreamer-eval-contracts:
    name: Dreamer eval lane contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dreamer eval unit contracts
        run: bun run test:dreamer-eval-unit

  mc-host-client-interop:
    name: mc-host client interop (Bun + Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Adversarial scenarios (Bun)
        working-directory: packages/plugin
        run: bun scripts/run-mc-host-client-adversarial.ts

      - name: Adversarial scenarios (Node 24)
        run: bun run --cwd packages/plugin test:mc-host-client:node

  check-rust:
    name: Check (Rust fmt + mc-core features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      # `cargo fmt` resolves the workspace from metadata without compiling the sibling stubs.
      # Clippy remains in `lint:rust` because it must compile the `cortexkit-*` siblings, which the stubs cannot support.
      - name: Format check (root workspace)
        run: cargo fmt --check

      # Every workspace member enables `mc-core` default features.
      # `cargo check -p mc-core --no-default-features` builds the cache-core-off configuration.
      # mc-core does not depend on the stubbed cortexkit crates.
      - name: mc-core feature-off build
        run: cargo check -p mc-core --no-default-features

  benchmark-retrieval-check:
    name: Benchmark (retrieval, deterministic CI profile)
    runs-on: ubuntu-latest
    needs: [check-plugin]
    # The three checks each cap execution at the profile's `maxWallTimeMs` value of 10 minutes.
    # Checkout, installation, regression comparison, and artifact upload also consume the job timeout.
    # A 45-minute timeout exceeds the three-check 30-minute budget by 15 minutes.
    # The 15-minute timeout reserve lets the CLI self-interrupt before GitHub terminates the job.
    # The CLI self-interrupts before GitHub's hard non-diagnostic timeout kill.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The CLI requires exactly three candidate reports because it computes latency as their median.
      # Without `--require-latency`, latency is informational; the gate exits 0 for a quality pass and 1 for a quality policy failure.
      - name: Retrieval benchmark check (ci profile, three runs)
        run: |
          mkdir -p benchmark-artifacts
          for run in 1 2 3; do
            bun packages/plugin/scripts/benchmark-retrieval.ts check \
              --profile ci \
              --out "benchmark-artifacts/retrieval-check-report-$run.json" \
              --candidate-pool \
              "benchmark-artifacts/retrieval-candidate-pool-$run.json"
          done

      - name: Gate quality against published ci baseline
        run: |
          fixtures=packages/plugin/scripts/fixtures/retrieval-benchmark
          baseline="$fixtures/baselines/v1"
          bun packages/plugin/scripts/benchmark-retrieval.ts regression \
            --baseline "$baseline/quality.json" \
            --policy "$baseline/policy.json" \
            --candidate benchmark-artifacts/retrieval-check-report-1.json \
            --candidate benchmark-artifacts/retrieval-check-report-2.json \
            --candidate benchmark-artifacts/retrieval-check-report-3.json \
            --out benchmark-artifacts/retrieval-regression.json

      # Failed checks still upload the diagnostic artifact.
      - name: Archive report and candidate pool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark-ci
          path: benchmark-artifacts/
          if-no-files-found: warn

  e2e-opencode:
    name: E2E (OpenCode, Docker)
    runs-on: ubuntu-latest
    needs: [check-plugin]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build OpenCode plugin
        run: bun run --cwd packages/plugin build

      - name: Build CLI
        # `Dockerfile.opencode` requires `packages/cli/dist/`.
        run: bun run --cwd packages/cli build

      - name: Build E2E image
        run: |
          docker build \
            --platform linux/amd64 \
            -f tests/docker/Dockerfile.opencode \
            -t mc-e2e-opencode \
            .

      - name: Run E2E
        run: docker run --rm --platform linux/amd64 mc-e2e-opencode

  e2e-pi:
    name: E2E (Pi, Docker)
    runs-on: ubuntu-latest
    needs: [check-pi-plugin]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build Pi plugin
        run: bun run --cwd packages/pi-plugin build

      - name: Build CLI
        # `Dockerfile.pi` requires `packages/cli/dist/` for `magic-context doctor --harness pi`.
        run: bun run --cwd packages/cli build

      - name: Build E2E image
        # The Pi Dockerfile installs runtime deps fresh inside the image
        # The image builds `better-sqlite3` for linux/amd64, so host-side `npm install` is unnecessary.
        run: |
          docker build \
            --platform linux/amd64 \
            -f tests/docker/Dockerfile.pi \
            -t mc-e2e-pi \
            .

      - name: Run E2E
        run: docker run --rm --platform linux/amd64 mc-e2e-pi

  e2e-omp:
    name: E2E (Oh My Pi, real Docker)
    runs-on: ubuntu-latest
    needs: [check-pi-plugin]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build Pi-compatible plugin and OMP argv renderer
        run: |
          bun run --cwd packages/pi-plugin build
          bun run --cwd packages/pi-plugin build:e2e-argv

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Build real OMP E2E image
        run: |
          docker build \
            --platform linux/amd64 \
            -f tests/docker/Dockerfile.omp \
            -t mc-e2e-omp \
            .

      - name: Run real OMP install and session smoke
        run: docker run --rm --platform linux/amd64 mc-e2e-omp

  e2e-host-opencode:
    name: E2E (OpenCode, host behavior)
    runs-on: ubuntu-latest
    # The Docker install-and-smoke path must pass before the deep behavior suite runs.
    needs: [e2e-opencode]
    # The incident-pool and historian-eval harness tests boot cold runners sequentially; 75 minutes covers them, the host suite, and cold-runner variance.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # The host suite spawns `opencode serve`, which requires OpenCode on `PATH`.
      - name: Install opencode
        # CI tests the latest OpenCode release; no `--version` is passed.
        # resolved upstream.
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify opencode on PATH
        run: opencode --version

      - name: Build OpenCode plugin
        # Host tests pass `packages/plugin/` to `opencode serve` as a `file://` plugin, which requires `packages/plugin/dist`.
        run: bun run --cwd packages/plugin build

      - name: Build Pi plugin
        # The OpenCode selection includes cross-harness parity tests that start a Pi runner alongside OpenCode.
        # The Pi runner asserts that `packages/pi-plugin/dist/index.js` exists before booting.
        run: bun run --cwd packages/pi-plugin build

      # The workflow removes inherited `NODE_ENV=test` so the spawned `opencode` subprocess uses normal local logging and runtime behavior.
      #
      # A 300s per-test and per-hook timeout accommodates cold-runner dependency resolution and OpenCode startup.
      # On cold GitHub-hosted runners, Bun's first test file pays the dependency-resolution and OpenCode cold-start cost.
      # `beforeAll(TestHarness.create)` incurs the OpenCode binary cold-start cost.
      # `beforeAll(TestHarness.create)` can exceed Bun's 120s default.
      - name: Run host e2e suite (OpenCode tests only)
        env:
          NODE_ENV: ""
          MC_E2E_MODE: ts
        # The script includes standalone oracles outside the manifest's `tests/**/*.test.ts` inventory.
        # Rust requires the unchecked-out `../commons` and `../subconscious` path dependencies.
        # This job excludes the Rust host group because the local release gate runs it.
        run: bun run --cwd packages/e2e-tests test:opencode-e2e

  e2e-host-pi:
    name: E2E (Pi, host behavior)
    runs-on: ubuntu-latest
    needs: [e2e-pi]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pi tests resolve the Pi binary with `createRequire` from `packages/pi-plugin`.
      # `@earendil-works/pi-coding-agent` is a workspace dependency of `packages/pi-plugin`.
      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # `pi-cross-harness.test.ts` starts both a Pi runner and `opencode serve`.
      # Cross-harness memory-sharing verification requires `opencode serve`.
      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify opencode on PATH
        run: opencode --version

      - name: Build Pi plugin
        run: bun run --cwd packages/pi-plugin build

      # `pi-cross-harness.test.ts` also instantiates the OpenCode harness.
      # The OpenCode harness starts `opencode serve` with a `file://` plugin specifier for `packages/plugin`.
      # `packages/plugin/dist` must exist before the harness starts.
      - name: Build OpenCode plugin
        run: bun run --cwd packages/plugin build

      # A 300s per-test timeout accommodates cold startup and mock-provider HTTP latency on shared runners.
      # Pi historian publication crosses an HTTP boundary into the mock provider.
      - name: Run host e2e suite (Pi tests from mode manifest)
        env:
          NODE_ENV: ""
          MC_E2E_MODE: ts
        run: bun run --cwd packages/e2e-tests test:pi-e2e

  incident-regression-pool:
    name: Incident regression pool (supported TS)
    runs-on: ubuntu-latest
    needs: [check-plugin, check-pi-plugin]
    # The job timeout covers the aggregate sequential case deadline.
    # `MC_E2E_MODE=ts` runs 10 OpenCode and 4 Pi variants sequentially, each with a 600s deadline.
    # The 14 sequential 600s case budgets total 140 minutes before setup.
    # At a lower cap, the job times out mid-schedule and produces no per-case classification.
    # A slow red build preserves per-case classifications.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Build supported TS harness plugins
        run: |
          bun run --cwd packages/plugin build
          bun run --cwd packages/pi-plugin build

      - name: Validate append-only incident history against trusted event base
        run: bun run --cwd packages/e2e-tests validate:incident-history:ci

      - name: Reject changed mutation-bound verifiers without replay evidence
        run: bun run --cwd packages/e2e-tests validate:incident-verifiers:ci

      - name: Run incident unit coverage
        run: bun run --cwd packages/e2e-tests test:incident-unit

      - name: Run supported TS incident schedule
        env:
          NODE_ENV: ""
        run: >-
          bun run --cwd packages/e2e-tests test:incidents --mode ts
          --timeout 600000

      - name: Archive explicit incident report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-pool-ts
          path: packages/e2e-tests/artifacts/incident-pool-ts-report.json
          if-no-files-found: warn
