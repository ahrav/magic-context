name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# Pipeline shape on every push to main and every PR:
#
#   check-plugin, check-pi-plugin
#   (unit tests + lint + typecheck, parallel)
#                  ↓
#   e2e-opencode, e2e-pi
#   (Docker install + smoke, parallel — gated by unit)
#                  ↓
#   e2e-host-opencode, e2e-host-pi
#   (host behavior suite from packages/e2e-tests, parallel — gated by Docker)
#
# Two e2e layers cover different concerns:
#   - Docker e2e: fresh-install smoke (plugin loads, doctor clean, one mock
#     turn writes DB rows under cortexkit path with right harness). Catches
#     packaging / install-flow regressions.
#   - Host e2e: behavior suite with byte-level wire assertions, multi-turn
#     cache stability, historian publish behavior, tag-owner collision,
#     synthetic todowrite, cross-harness memory, etc. Spawns real
#     `opencode serve` / Pi subprocesses against an embedded mock provider.
#     Catches cache-stability + correctness regressions that the smoke layer
#     cannot see.
#
# Docker e2e was previously in a separate workflow (e2e-docker.yml). Folding
# it here means every PR and main push exercises the full unit → Docker → host
# gauntlet.

jobs:
  shm-hardening-gate:
    name: SHM failure-hardening matrix gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Matrix validator unit tests
        working-directory: packages/e2e-tests
        run: bun test scripts/validate-shm-hardening-matrix.test.ts

      - name: Validate fixed ring manifest
        working-directory: packages/e2e-tests
        run: bun scripts/validate-shm-hardening-matrix.ts

  release-contract-gate:
    name: mc-host release contract drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The contract is committed in four byte-coupled forms (canonical
      # JSON, the include!-able Rust constants that feed production epoch
      # values, and two TypeScript embeddings). This is the only gate that
      # proves they were regenerated together.
      - name: Check generated release contract for drift
        run: bun run release:contract:check

  shm-crash-recovery:
    name: Mandatory ring unit and client suites (Linux)
    runs-on: ubuntu-latest
    needs: [shm-hardening-gate]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      # The unit suites carry the setup-socket handshake, ring transport, and
      # control-response coverage. Without them a proof-transcript or
      # response-shape change reaches the only supported transport unchecked.
      - name: Mandatory ring unit suite
        run: cargo nextest run -p mc-host -p mc-shm-transport --lib

      - name: Mandatory ring client suite
        run: cargo nextest run -p mc-host --test client

      # The long soak has `#[ignore]`; this command excludes it without
      # `--run-ignored`.
      - name: Crash reclamation and bounded-resource suites
        run: |
          cargo nextest run -p mc-host \
            --test shm_failure_modes --test shm_soak

  shm-source-build:
    name: Shared memory source build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      # mc-module is absent here on purpose. It depends on mc-core and
      # mc-store, which import real types from the ../commons cortexkit
      # crates; the stubs above are metadata-only, so anything that COMPILES
      # mc-module fails to resolve those imports. The ck-mc-host binary build
      # and the lifecycle_cli contract run in the mc-host-lifecycle job, which
      # checks out the sibling sources instead of stubbing them.
      - name: Source-build transport, host, and addon
        run: cargo build -p mc-shm-transport -p mc-host -p mc-shm-native

      - name: Rust contracts and lifecycle (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo nextest run -p mc-shm-native -p mc-shm-transport
          cargo nextest run -p mc-host \
            --test client --test lifecycle

      - name: Fixed-ring contracts (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo nextest run -p mc-shm-native
          cargo nextest run -p mc-shm-transport \
            --test contract --test fuzz_corpus
          cargo nextest run -p mc-host --test client --test lifecycle

      - name: Rust lease non-escape
        run: cargo test -p mc-host --doc

      - name: Build package-relative addon from source
        run: bun run --cwd packages/mc-shm-native build:source

      - name: Native behavior (Bun)
        run: bun run --cwd packages/mc-shm-native test:bun

      - name: Native behavior (Node 24)
        run: bun run --cwd packages/mc-shm-native test:node

      - name: Mandatory capability activation (Bun and Node 24)
        run: |
          bun run --cwd packages/mc-shm-native test:capability:bun
          bun run --cwd packages/mc-shm-native test:capability:node

      - name: Plugin shared-memory contracts (Bun)
        run: bun test packages/plugin/src/shared/mc-host-client

      - name: Plugin typecheck
        run: bun run --cwd packages/plugin typecheck

      - name: Reject prebuilt native modules
        run: |
          test -z "$(git ls-files '*.node')"
          rm -f packages/mc-shm-native/mc_shm_native.node
          test ! -e packages/mc-shm-native/mc_shm_native.node

  mc-host-lifecycle:
    name: mc-host lifecycle integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: magic-context
    steps:
      - uses: actions/checkout@v5
        with:
          path: magic-context
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: ahrav/commons
          ref: 77cd36b9cb8bde762d2b39d4807bb1c0338ed927
          path: commons
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - name: Store tests against real commons
        run: cargo test -p mc-store

      - name: Host lifecycle and closure proofs (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test -p mc-host \
            --test broca_protocol \
            --test broca_subprocess \
            --test harness_closure \
            --test protocol_vectors

      # token_cache::test_cache_guard serializes the tests that share the
      # process-global cache, so this suite is correct under either runner.
      - name: Module transform and token-cache proofs (Linux)
        if: runner.os == 'Linux'
        run: cargo nextest run -p mc-module --lib

      - name: Native module adapter and CLI lifecycle (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test -p mc-module --bin ck-mc-host
          cargo test -p mc-module \
            --test host_adapter \
            --test lifecycle_cli

      # The release ships darwin payloads, so this leg proves the native
      # lifecycle binary compiles and links for darwin and that its
      # argument-parsing and version/release-metadata contract holds there.
      # It asserts nothing about lifecycle state: those proofs need a
      # published daemon, which requires Broca's `/proc` process identity,
      # and a data root the `O_NOFOLLOW` lifecycle path walk accepts, which
      # the darwin temporary directory's `/var` symlink is not, so they
      # compile out here.
      - name: Native lifecycle binary and CLI contract (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build -p mc-module --bin ck-mc-host
          cargo test -p mc-module --test lifecycle_cli

  check-plugin:
    name: Check (plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # node:sqlite (the Pi / OpenCode-Desktop SQLite backend) is only reachable
      # under Node, not Bun. Node 24 also strips the smoke script's inline TS.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Check compiled TUI freshness
        run: bun run --cwd packages/plugin check:tui-compiled

      # `bun run test` ends in test:release, whose dependency-boundary check
      # shells out to `cargo tree -p mc-host`. cargo refuses to load the
      # workspace until every path-dep manifest exists, including the
      # ../commons cortexkit crates. Metadata-only stubs satisfy the manifest
      # graph; nothing in this job compiles them.
      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      # Pins the cargo used by the warm-up below and by the same `cargo tree`
      # inside test:release, matching every other cargo-invoking job. Without
      # it both resolve to whatever rustc the runner image ships, so an image
      # change surfaces as a cargo failure inside a TypeScript job.
      - uses: dtolnay/rust-toolchain@stable

      - name: Warm mc-host dependency graph
        run: cargo tree -p mc-host -e normal >/dev/null

      - name: Test
        run: bun run test

      # Exercise the node:sqlite branch of shared/sqlite.ts under REAL Node —
      # bun test only covers the bun:sqlite branch, so the transaction() shim,
      # readonly→readOnly mapping, and the array-bind normalization (#151) would
      # otherwise ship unverified on Pi/Desktop.
      - name: Smoke (node:sqlite backend)
        run: node packages/plugin/scripts/smoke-node-sqlite.ts

      # The smart-note QuickJS sandbox loads a ~1MB WASM. `bun test` runs it
      # from src (wasm resolves via node_modules), so it cannot catch a
      # BUNDLING break where the wasm isn't embedded in dist. This bundles
      # sandbox-runner exactly like the package build and runs a real check
      # against the bundle.
      - name: Smoke (smart-note wasm bundle)
        run: bun packages/plugin/scripts/smoke-smartnote-wasm.ts

      # The raw-TSX ./tui entry imports @opentui/solid's JSX runtime. `bun test`
      # never imports it, so a missing/mismatched OpenTUI or Solid dep (as broke
      # on OpenCode 1.17.10's OpenTUI 0.4.2 bump) ships a TUI that won't load.
      # Import the entry the way OpenCode loads the ./tui export to catch it.
      - name: Smoke (TUI entry import)
        run: bun packages/plugin/scripts/smoke-tui-import.ts

      # The dev-path import above cannot catch packaging breaks: OpenTUI's Solid
      # transform skips node_modules sources, so only a packed PROD install
      # exercises the resolution path OpenCode's plugin cache uses (v0.31.1
      # shipped without runtime deps and passed every dev-path check).
      - name: Smoke (TUI packaged install import)
        run: bun packages/plugin/scripts/smoke-tui-pack-install.ts

      # Tokenizer loading is lazy, so an import-only smoke misses resolution
      # failures. Pack + npm-install prod deps, then exercise an estimate from a
      # compiled Bun host matching OpenCode's /$bunfs/root runtime.
      - name: Smoke (tokenizer packaged install estimate)
        run: bun packages/plugin/scripts/smoke-tokenizer-pack-install.ts

  check-pi-plugin:
    name: Check (pi-plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run --cwd packages/pi-plugin typecheck

      - name: Lint
        run: bun run --cwd packages/pi-plugin lint

      - name: Build
        run: bun run --cwd packages/pi-plugin build

      - name: Test
        run: bun run --cwd packages/pi-plugin test

  prospective-release-holdout:
    name: Prospective release holdout contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prospective holdout unit contracts
        run: bun run test:prospective-unit

      - name: Authenticate lifecycle-appropriate epoch artifacts
        run: bun run validate:prospective-holdout

      - name: E2E harness typecheck
        run: bun run --cwd packages/e2e-tests typecheck

  release-qualification-gate:
    name: Release contract + production-input qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The release-script suite asserts the mc-host -> mc-module dependency
      # boundary through `cargo tree`, which needs a resolvable workspace.
      - uses: dtolnay/rust-toolchain@stable

      # Production payload packing refuses any npm outside the certified 11.x
      # line, and this job otherwise inherits whichever npm the runner image
      # ships. Node 24 carries npm 11.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      # Same script `check:all` runs, so a contributor's local pass covers
      # exactly what this gate covers.
      - name: Release script unit tests
        run: bun run test:release

      - name: U8 release contract drift
        run: bun run release:contract:check

      # Drift-only: byte verification needs the real production artifacts,
      # which live on the qualifying host, so --check stays portable here and
      # guards the committed lock/credentials/evidence digests.
      - name: U9 production-input qualification drift
        run: bun run release:qualify:check

      # The payload packages carry the optionalDependencies that resolve native
      # bytes, and the trust index is what bootstrap decides against. Without
      # this step, edited payload package metadata, exact-pin drift in a
      # parent's optionalDependencies, or a hand-edited trust artifact merges
      # unchecked.
      - name: U6 payload package + trust index drift
        run: bun run release:payload:check

  # Its own job, not a step in prospective-release-holdout: steps in one job
  # short-circuit, so an unrelated contract lane failing first would skip this
  # one and leave the historian-eval gate silently unenforced — which is the
  # state this job exists to end. Nothing invoked test:historian-eval-unit
  # before: test:e2e selects --mode ts and test:opencode-e2e runs the green
  # manifest, and neither reaches historianEvalUnitFiles(), so the contract and
  # freeze lint could regress with every other lane green.
  #
  # Every deterministic historian-eval gate lives HERE, and the job declares no
  # `needs`, for the same reason: a gate placed in a separate job downstream of
  # check-plugin is skipped whenever check-plugin fails, which reproduces the
  # silent non-enforcement one job away. Contract lint, scorer tests, the freeze
  # lint, and the mutation battery all run per-PR with no live model calls and no
  # credentials (R14); live scenario runs are scheduled or dispatched through
  # historian-eval.yml only.
  historian-eval-contracts:
    name: Historian eval lane contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Historian eval unit contracts
        run: bun run test:historian-eval-unit

      - name: Freeze lint over the dev corpus
        run: bun packages/e2e-tests/scripts/run-historian-eval.ts --lint

      - name: Run the invalid-state mutation battery
        run: bun packages/e2e-tests/scripts/run-historian-eval.ts --mutations

  # Its own job with no `needs`, for the reasons spelled out above the historian
  # lane: a gate placed as a step in another job is skipped whenever an earlier
  # step fails, and a gate placed downstream of check-plugin is skipped whenever
  # check-plugin fails — both reproduce silent non-enforcement one hop away.
  #
  # Nothing invoked test:dreamer-eval-unit before: test:e2e selects --mode ts
  # and test:opencode-e2e runs the harness manifests, and neither reaches
  # dreamerEvalUnitFiles(), so the scenario contract, seeder, scorer, and
  # mutation battery could regress with every other lane green. The suites are
  # credential-free and make no live model calls; live scenario runs stay out of
  # per-PR CI.
  dreamer-eval-contracts:
    name: Dreamer eval lane contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dreamer eval unit contracts
        run: bun run test:dreamer-eval-unit

  mc-host-client-interop:
    name: mc-host client interop (Bun + Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      - name: Build shared-memory addon from source
        run: bun run --cwd packages/mc-shm-native build:source

      - name: Shared-memory client smoke (Bun)
        run: bun run --cwd packages/plugin smoke:mc-host-client:bun

      - name: Shared-memory capability preflight (Node 24)
        run: bun run --cwd packages/mc-shm-native test:capability:node

  check-rust:
    name: Check (Rust fmt + mc-core features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      # fmt resolves the workspace from metadata alone, so it works against the
      # sibling stubs. Clippy would have to compile the cortexkit-* siblings,
      # which the stubs cannot support, so it stays in the local lint:rust gate.
      - name: Format check (root workspace)
        run: cargo fmt --check

      # Every workspace member takes mc-core with default features, so a plain
      # --workspace pass never compiles the cache-core-off configuration; this
      # check keeps that feature gate building. Without default features,
      # mc-core does not depend on the stubbed cortexkit crates.
      - name: mc-core feature-off build
        run: cargo check -p mc-core --no-default-features

  benchmark-retrieval-check:
    name: Benchmark (retrieval, deterministic CI profile)
    runs-on: ubuntu-latest
    needs: [check-plugin]
    # Three check runs (each self-bounded at the profile's 10-minute
    # maxWallTimeMs) plus checkout, install, the regression comparison, and
    # artifact upload. 45 leaves real margin over the 30-minute worst-case
    # run budget so the CLI's clean self-interrupt fires before GitHub's
    # hard non-diagnostic kill.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Three complete runs because the regression CLI takes exactly three
      # candidate reports (median-of-three latency rule); on the ci profile
      # latency stays informational, so without --require-latency the gate
      # is quality: pass/quality-only exit 0, a quality policy-fail exits 1.
      - name: Retrieval benchmark check (ci profile, three runs)
        run: |
          mkdir -p benchmark-artifacts
          for run in 1 2 3; do
            bun packages/plugin/scripts/benchmark-retrieval.ts check \
              --profile ci \
              --out "benchmark-artifacts/retrieval-check-report-$run.json" \
              --candidate-pool \
              "benchmark-artifacts/retrieval-candidate-pool-$run.json"
          done

      - name: Gate quality against published ci baseline
        run: |
          fixtures=packages/plugin/scripts/fixtures/retrieval-benchmark
          baseline="$fixtures/baselines/v1"
          bun packages/plugin/scripts/benchmark-retrieval.ts regression \
            --baseline "$baseline/quality.json" \
            --policy "$baseline/policy.json" \
            --candidate benchmark-artifacts/retrieval-check-report-1.json \
            --candidate benchmark-artifacts/retrieval-check-report-2.json \
            --candidate benchmark-artifacts/retrieval-check-report-3.json \
            --out benchmark-artifacts/retrieval-regression.json

      # The CLI writes the report before it sets a failing exit code, so a
      # failed check still produces the artifact that explains the failure.
      - name: Archive report and candidate pool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark-ci
          path: benchmark-artifacts/
          if-no-files-found: warn

  e2e-opencode:
    name: E2E (OpenCode, Docker)
    runs-on: ubuntu-latest
    needs: [check-plugin]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build shared-memory package loader
        run: bun run --cwd packages/mc-shm-native build:js

      - name: Build OpenCode plugin
        run: bun run --cwd packages/plugin build

      - name: Build CLI
        # The CLI is its own package (@cortexkit/magic-context) since
        # v0.16.1; Dockerfile.opencode COPYs packages/cli/dist/ in.
        run: bun run --cwd packages/cli build

      - name: Build E2E image
        run: |
          docker build \
            --platform linux/amd64 \
            -f tests/docker/Dockerfile.opencode \
            -t mc-e2e-opencode \
            .

      - name: Run E2E
        run: docker run --rm --platform linux/amd64 mc-e2e-opencode

  e2e-pi:
    name: E2E (Pi, Docker)
    runs-on: ubuntu-latest
    needs: [check-pi-plugin]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build shared-memory package loader
        run: bun run --cwd packages/mc-shm-native build:js

      - name: Build Pi plugin
        run: bun run --cwd packages/pi-plugin build

      - name: Build CLI
        # The CLI moved to its own package (@cortexkit/magic-context) in
        # v0.16.1. Dockerfile.pi COPYs packages/cli/dist/ in for the
        # `magic-context doctor --harness pi` test invocation.
        run: bun run --cwd packages/cli build

      - name: Build E2E image
        # The Pi Dockerfile installs runtime deps fresh inside the image
        # (better-sqlite3 builds against linux/amd64), so no host-side
        # `npm install` is needed.
        run: |
          docker build \
            --platform linux/amd64 \
            -f tests/docker/Dockerfile.pi \
            -t mc-e2e-pi \
            .

      - name: Run E2E
        run: docker run --rm --platform linux/amd64 mc-e2e-pi

  e2e-omp:
    name: E2E (Oh My Pi, real Docker)
    runs-on: ubuntu-latest
    needs: [check-pi-plugin]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build shared-memory package loader
        run: bun run --cwd packages/mc-shm-native build:js

      - name: Build Pi-compatible plugin and OMP argv renderer
        run: |
          bun run --cwd packages/pi-plugin build
          bun run --cwd packages/pi-plugin build:e2e-argv

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Build real OMP E2E image
        run: |
          docker build \
            --platform linux/amd64 \
            -f tests/docker/Dockerfile.omp \
            -t mc-e2e-omp \
            .

      - name: Run real OMP install and session smoke
        run: docker run --rm --platform linux/amd64 mc-e2e-omp

  e2e-host-opencode:
    name: E2E (OpenCode, host behavior)
    runs-on: ubuntu-latest
    # Gated on Docker e2e: no point exercising the deep behavior suite if
    # the simpler install+smoke path is broken.
    needs: [e2e-opencode]
    # The manifest selection includes the incident-pool green wrapper and the
    # historian-eval harness tests, both of which run their cases sequentially
    # with a cold harness boot per case; 60 minutes is too tight for that plus
    # the host suite, and the margin absorbs cold-runner boot variance.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # Install opencode the same way the Docker image does — the host
      # suite spawns `opencode serve` from PATH.
      - name: Install opencode
        # Float to LATEST (no --version) so CI exercises the opencode version
        # users actually run and catches upstream breakage as it ships — not at
        # our release time. (A fixed pin previously hid opencode 1.16's
        # post-overflow change, commit 7e09660c3, until release; the
        # overflow-recovery host test is now version-agnostic.) Trade-off: a
        # known-bad upstream release can turn CI red for unrelated PRs — if that
        # happens, temporarily re-pin with `--version X.Y.Z` here until it's
        # resolved upstream.
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify opencode on PATH
        run: opencode --version

      - name: Build OpenCode plugin
        # Host tests spawn `opencode serve` with a file:// plugin
        # specifier pointing at packages/plugin/, so dist must exist.
        run: bun run --cwd packages/plugin build

      - name: Build Pi plugin
        # The OpenCode selection carries cross-harness parity tests that spawn a
        # Pi runner alongside opencode, and that spawn asserts
        # packages/pi-plugin/dist/index.js exists before booting.
        run: bun run --cwd packages/pi-plugin build

      # Strip inherited NODE_ENV=test so the spawned opencode subprocess
      # gets the same logging + runtime behavior as a normal local run
      # (documented in CONTRIBUTING / project memory).
      #
      # Per-test (and per-hook) timeout bumped to 300s: the first test file
      # Bun loads on a cold GitHub-hosted runner pays the dependency-resolution
      # + opencode-binary cold-start cost in its
      # `beforeAll(TestHarness.create)`, which can exceed Bun's 120s default.
      # Subsequent files run in 5-10s.
      - name: Run host e2e suite (OpenCode tests only)
        env:
          NODE_ENV: ""
          MC_E2E_MODE: ts
        # run-test-selection.ts derives the OpenCode list from the mode
        # manifest, carries the standalone oracles that live outside the
        # manifest's tests/**/*.test.ts inventory (see standaloneUnitFiles),
        # and runs the incident-pool green wrapper alone in a second phase
        # with --max-concurrency 1. Rust is intentionally absent from this job
        # because its ../commons and ../subconscious path-deps are not checked
        # out here; the local release gate runs that host group.
        run: bun run --cwd packages/e2e-tests test:opencode-e2e

  e2e-host-pi:
    name: E2E (Pi, host behavior)
    runs-on: ubuntu-latest
    needs: [e2e-pi]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pi tests resolve the Pi binary via createRequire against
      # @earendil-works/pi-coding-agent, which is a workspace dep of
      # packages/pi-plugin. `bun install` brings it in.
      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # pi-cross-harness.test.ts spawns BOTH a Pi runner and an OpenCode
      # serve to verify cross-harness memory sharing, so this job needs
      # opencode on PATH too. Float to LATEST like the OpenCode host job
      # (see that step for the rationale + re-pin escape hatch).
      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify opencode on PATH
        run: opencode --version

      # The parent builds mark the addon --external, so its generated entry
      # point must exist before any Node-runtime import resolves it.
      - name: Build shared-memory addon entry point
        run: bun run --cwd packages/mc-shm-native build:js

      - name: Build Pi plugin
        run: bun run --cwd packages/pi-plugin build

      # pi-cross-harness also instantiates the OpenCode harness, which
      # spawns `opencode serve` with a file:// plugin specifier pointing
      # at packages/plugin/. That dist must exist.
      - name: Build OpenCode plugin
        run: bun run --cwd packages/plugin build

      # Per-test timeout bumped to 300s for the same cold-start reason as
      # the OpenCode host job. Pi historian publish path also crosses an
      # HTTP boundary into the mock provider, which is slower on shared
      # runners than on local hardware.
      - name: Run host e2e suite (Pi tests from mode manifest)
        env:
          NODE_ENV: ""
          MC_E2E_MODE: ts
        run: bun run --cwd packages/e2e-tests test:pi-e2e

  incident-regression-pool:
    name: Incident regression pool (supported TS)
    runs-on: ubuntu-latest
    needs: [check-plugin, check-pi-plugin]
    # Sized for the aggregate sequential deadline, not the happy path. `--mode
    # ts` runs 10 OpenCode then 4 Pi variants one at a time, each allowed the
    # 600s budget below, so a run where cases time out can need ~140 minutes on
    # top of setup. At a lower cap the job is killed mid-schedule and publishes
    # no report at all, which loses the per-case classification that is the
    # whole point of this job — strictly worse than a slow red build. Cases
    # normally finish in seconds, so this bound is only reached when something
    # is already wrong.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # The parent builds mark the addon --external, so its generated entry
      # point must exist before any Node-runtime import resolves it.
      - name: Build shared-memory addon entry point
        run: bun run --cwd packages/mc-shm-native build:js

      - name: Build supported TS harness plugins
        run: |
          bun run --cwd packages/plugin build
          bun run --cwd packages/pi-plugin build

      - name: Validate append-only incident history against trusted event base
        run: bun run --cwd packages/e2e-tests validate:incident-history:ci

      - name: Reject changed mutation-bound verifiers without replay evidence
        run: bun run --cwd packages/e2e-tests validate:incident-verifiers:ci

      - name: Run incident unit coverage
        run: bun run --cwd packages/e2e-tests test:incident-unit

      - name: Run supported TS incident schedule
        env:
          NODE_ENV: ""
        # Same 600s per-case budget the host suites use: a cold runner pays Bun
        # bootstrap plus a fresh harness and `opencode serve` startup inside the
        # first case, which the 120s default deadline cannot cover.
        run: >-
          bun run --cwd packages/e2e-tests test:incidents --mode ts
          --timeout 600000

      - name: Archive explicit incident report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-pool-ts
          path: packages/e2e-tests/artifacts/incident-pool-ts-report.json
          if-no-files-found: warn
