name: SHM hardening opt-in

on:
  workflow_dispatch:
    inputs:
      soak_hours:
        description: Measured ring soak duration in hours (hosted runners cap the job at 6h)
        required: false
        default: "5"
      fuzz_seconds:
        description: Per-target libFuzzer -max_total_time seconds
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  full-soak:
    name: Long-running ring resource soak (Linux)
    runs-on: ubuntu-latest
    # GitHub terminates a hosted-runner job at six hours of execution time and
    # timeout-minutes cannot raise that ceiling, so the measured soak plus
    # checkout and compilation has to fit inside it. This timeout fires first so
    # an overrun fails with our logs instead of an opaque platform kill.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Provision metadata-only sibling stubs
        run: sh scripts/provision-rust-ci-stubs.sh

      - uses: oven-sh/setup-bun@v2

      - name: Measured fixed-ring soak
        working-directory: packages/e2e-tests
        env:
          SOAK_HOURS: ${{ inputs.soak_hours }}
        run: |
          # This job is pinned to a hosted runner, so a request the platform
          # cannot honour is a configuration error rather than a soak failure.
          if ! awk -v h="$SOAK_HOURS" 'BEGIN { exit !(h + 0 > 0 && h + 0 <= 5) }' </dev/null; then
            echo "soak_hours must be >0 and <=5 to fit the six-hour hosted-runner limit, got: $SOAK_HOURS" >&2
            exit 1
          fi
          bun scripts/run-shm-soak.ts --hours "$SOAK_HOURS"

  bounded-fuzz:
    name: Bounded libFuzzer campaign (nested fuzz workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Nested fuzz workspace fmt and build
        working-directory: crates/mc-shm-transport/fuzz
        run: |
          cargo fmt --check
          cargo check --locked

      - name: Bounded fuzz per target
        working-directory: crates/mc-shm-transport
        env:
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds }}
        run: |
          case "$FUZZ_SECONDS" in
            ''|*[!0-9]*)
              echo "fuzz_seconds must be an unsigned integer, got: $FUZZ_SECONDS" >&2
              exit 1
              ;;
          esac
          # libFuzzer's -max_total_time bounds the run only when positive;
          # A zero value would starve the remaining targets.
          if [ "$FUZZ_SECONDS" -eq 0 ]; then
            echo "fuzz_seconds must be a positive number of seconds" >&2
            exit 1
          fi
          for target in frame_descriptor provider_grant provider_sample; do
            cargo +nightly fuzz run "$target" -- \
              -max_total_time="$FUZZ_SECONDS"
          done
