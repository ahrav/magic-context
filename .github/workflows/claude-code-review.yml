name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: >-
            /code-review:code-review
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            --comment
            ${{ github.event.action == 'synchronize'
              && 'Override the skip conditions: proceed even if Claude already commented on this PR. A new push triggered this run, so review the current diff.'
              || '' }}
          claude_args: >-
            --model claude-opus-5
            --allowedTools
            "Task,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue
            list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr
            view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
