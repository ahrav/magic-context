[package]
name = "mc-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Directly linked host for Magic Context, Synapse, and Broca components."

[dependencies]
serde = { workspace = true }
hmac = "0.12"
subtle = "2"
serde_json = { workspace = true }
sha2 = { workspace = true }
fastembed = { version = "=6.0.0", default-features = false, features = ["ort-load-dynamic"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
tokio = { workspace = true, features = ["process"] }
tokio-util = { version = "0.7", features = ["rt"] }
rustix = { version = "1.1.4", features = ["fs", "process", "thread"] }
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "signal"] }
# `stdio` only serves the broca_subprocess fixture that replaces its own
# stdin; feature unification keeps production builds on fs+process alone.
rustix = { version = "1.1.4", features = ["stdio"] }
criterion = "=0.8.2"
hdrhistogram = "=7.6.0"

[[test]]
name = "broca_subprocess"
harness = false

[[bench]]
name = "ipc_budget"
harness = false
