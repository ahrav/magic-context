[package]
name = "mc-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
subc-protocol = { version = "=0.10.0" }
subc-transport = { version = "=0.5.0" }
subc-control = { version = "=0.1.1" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
getrandom = "0.2"

[dev-dependencies]
hmac = "0.12"
sha2 = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
