[package]
name = "mc-module"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
description = "Magic Context host component: harness-agnostic cache-stability transform backed by the single-writer mc-store."

[lib]
name = "mc_module"
path = "src/lib.rs"

[[example]]
name = "direct_host_fixture"
path = "examples/direct_host_fixture.rs"
required-features = ["direct-host-fixture"]

[[bin]]
name = "ck-mc-host"
path = "src/bin/ck-mc-host.rs"

[dependencies]
mc-core = { workspace = true }
mc-store = { workspace = true }
mc-tokenizer = { path = "../mc-tokenizer" }
mc-host = { path = "../mc-host" }
cortexkit-store-types = { workspace = true }
cortexkit-store = { workspace = true }
cortexkit-lease = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
tokio = { workspace = true, features = ["signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = { workspace = true }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
#
#
# `drive-fault` must remain outside the default feature set.
drive-fault = []
direct-host-fixture = []

[dev-dependencies]
chrono-tz = "0.10"
tokio = { workspace = true, features = ["signal"] }
# `mc-store` enables `test-support` only in dev-dependencies, so production builds exclude the feature.
mc-store = { workspace = true, features = ["test-support"] }
tempfile = "3"
filetime = "0.2"
