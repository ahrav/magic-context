[package]
name = "mc-tokenizer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Claude BPE token estimator for Magic Context: a bit-faithful Rust port of ai-tokenizer's claude encoding (tiktoken byte-BPE), used for m0 budget fitting."

[lib]
name = "mc_tokenizer"
path = "src/lib.rs"

[dependencies]
# tiktoken-rs provides the byte-BPE engine.
tiktoken-rs = "=0.11.0"
base64 = "0.22"
rustc-hash = "1.1"

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
