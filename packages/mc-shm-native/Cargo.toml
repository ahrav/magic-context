[package]
name = "mc-shm-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = "0.2"
libc = "0.2"
mc-shm-transport = { path = "../../crates/mc-shm-transport", default-features = false }
napi = { version = "=3.12.2", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.3"
rustix = { version = "1.1.4", features = ["event", "fs", "net"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
subtle = "2"

[dev-dependencies]
napi = { version = "=3.12.2", default-features = false, features = ["napi8", "dyn-symbols"] }

[build-dependencies]
napi-build = "2"
