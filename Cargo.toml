[workspace]
resolver = "2"
members = ["crates/mc-core", "crates/mc-store", "crates/mc-host", "crates/mc-module", "crates/mc-tokenizer", "crates/mc-shm-transport", "packages/mc-shm-native"]
# Exclude docs/evidence/subc-surface-probe because it uses published subc crates from crates.io rather than sibling sources.
# Exclude crates/mc-shm-transport/fuzz because it declares its own [workspace].
exclude = ["docs/evidence/subc-surface-probe", "crates/mc-shm-transport/fuzz"]

[workspace.dependencies]
# alfonso-core arrangement.
cortexkit-cache-core = { path = "../commons/crates/cortexkit-cache-core" }
cortexkit-store = { path = "../commons/crates/cortexkit-store" }
cortexkit-store-types = { path = "../commons/crates/cortexkit-store-types" }
cortexkit-lease = { path = "../commons/crates/cortexkit-lease" }

# Internal crates.
mc-core = { path = "crates/mc-core" }
mc-store = { path = "crates/mc-store" }

# Pin rusqlite to cortexkit-store's version and features so Connection and Transaction types unify across with_conn.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
# 0.32 bundles SQLite 3.46.0 (pre-3.47.1 WAL-reset fix, sqlite.org/wal.html#walresetbug).
# Raising rusqlite requires bumping cortexkit-store in the same change.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
