# A root-CWD `bun test` recursively discovers every package's `*.test.ts`.
# Without this preload, root-CWD `bun test` runs discovered suites without the configured preload.
# Without the preload, bare `openDatabase()` calls rely on `resolveDatabasePath()`.
# `resolveDatabasePath()` redirects when `NODE_ENV=test`; the preload enables that redirect for root-CWD test runs.
[test]
preload = ["./packages/plugin/test-preload.ts"]
