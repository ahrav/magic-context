[package]
name = "subc-surface-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
subc-protocol = "0.10.0"
subc-transport = "0.5.0"
subc-control = "0.1.1"
subc-client-rs = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync", "time"] }
tempfile = "3"
