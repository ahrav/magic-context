# Perles Configuration

# `beads_dir` defaults to the current directory.
# beads_dir: /path/to/project

# UI settings
ui:
  show_counts: true       # Show issue counts in column headers
  show_status_bar: true   # Show status bar at bottom
  # `markdown_style` accepts `dark` or `light` and defaults to `dark`.
  vim_mode: false         # Enable vim keybindings in text input areas (orchestration mode)

  # Users may omit `keybindings`.
  # keybindings:

# Theme configuration
# `theme` accepts a preset and individual color overrides.
theme:
  # `preset` selects a predefined theme; `perles themes` lists the available presets.
  # preset: catppuccin-mocha
  #
  # Available presets:
  #
  # Color overrides apply whether or not `preset` is set.
  # colors:
  #   text.primary: "#FFFFFF"
  #   status.error: "#FF0000"
  #   priority.critical: "#FF5555"
  #
  # `perles themes --help` lists all available color tokens.

# Shift+J selects the next view; Shift+K selects the previous view.
views:
  - name: Default
    columns:
      - name: Blocked
        type: bql
        query: "status = open and blocked = true"
        color: "#FF8787"

      - name: Deferred
        type: bql
        query: "status = deferred or status = open and defer_until > now"
        color: "#808000"

      - name: Ready
        type: bql
        query: "status = open and ready = true"
        color: "#73F59F"

      - name: In Progress
        type: bql
        query: "status = in_progress"
        color: "#54A0FF"

      - name: Closed
        type: bql
        query: "status = closed"
        color: "#BBBBBB"

# View options:
# Each view requires `name` as its display name.
# Each view requires `columns`.
#
# Column options:
# Each column requires `name` as its display name.
# `type` accepts `bql` or `tree`.
# `query` is required when `type` is `bql`.
# `issue_id` is required when `type` is `tree`.
# `tree_mode` is optional when `type` is `tree` and accepts `deps` or `child`.
# `color` sets the column header's hex color.
#
# BQL queries support `type`, `priority`, `status`, `blocked`, `ready`, `label`, `title`, `id`, `created`, and `updated`.
# BQL queries support `=`, `!=`, `<`, `>`, `<=`, `>=`, `~`, `in`, and `not-in`; `~` performs a contains match.
#   Examples:
# A query can combine predicates: `type = bug and priority = P0`.
# A query can use `label in (urgent, critical)`.

# The orchestration settings select the AI clients used in orchestration mode.
orchestration:
  # `coordinator_client` accepts `claude`, `amp`, `codex`, `opencode`, or `cursor` and defaults to `claude`.
  coordinator_client: claude

  # `worker_client` accepts `claude`, `amp`, `codex`, `opencode`, or `cursor` and defaults to `claude`.
  worker_client: claude

  # `claude` settings apply when `coordinator_client` or `worker_client` is `claude`.
  claude:
    model: claude-opus-4-8  # claude-opus-4-8 (default); aliases like opus, sonnet, haiku also work

  # `codex` settings apply when `coordinator_client` or `worker_client` is `codex`.
  codex:
    model: gpt-5.5  # gpt-5.5 (default)

  # `amp` settings apply when `coordinator_client` or `worker_client` is `amp`.
  amp:
    model: opus    # opus (default) or sonnet
    mode: smart    # free, rush, or smart (default)

  # `opencode` settings apply when `coordinator_client` or `worker_client` is `opencode`.
  opencode:
    model: anthropic/claude-opus-4-8  # anthropic/claude-opus-4-8 (default)

  # `cursor` settings apply when `coordinator_client` or `worker_client` is `cursor`.
  # cursor:
  # An empty Cursor configuration uses Cursor's default.

  # # Ctrl+P opens the workflow picker in orchestration mode.
  # # Perles loads user workflows from ~/.perles/workflows/*.md.
  # workflows:
  #     file: "code_review.md"
  #
  # # enabled: false disables a built-in workflow.
  #     enabled: false
  #
  # # name and description override a built-in workflow's name and description.

  # Initialization phases use these timeouts.
  # All values use Go duration format (e.g., "30s", "2m", "1m30s")
  # timeouts:
  # # worktree_creation defaults to 30s.
  # # coordinator_start defaults to 60s.
  # # workspace_setup sets a 30s default timeout for MCP server and infrastructure setup.
  # # max_total defaults to 120s.

  # Sound Notifications
  # # The default enables all events.
  sound:
    events:
      workflow_complete:
        enabled: true

      review_verdict_approve:
        enabled: true

      review_verdict_deny:
        enabled: true

      worker_out_of_context:
        enabled: true

      coordinator_out_of_context:
        enabled: true

      user_notification:
        enabled: true
